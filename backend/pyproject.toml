[project]
name = "notemed-backend"
version = "1.0.0"
description = "API y componente de IA de NoteMed (notas de enfermería en UCI)."
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 110
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # el español usa tildes y signos en el texto

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_ignores = true
ignore_missing_imports = false
exclude = ["alembic/versions"]
